# Nyx Language Definition for GitHub Linguist
# This file should be added to https://github.com/github/linguist/blob/master/lib/linguist/languages.yml

Nyx:
  type: programming
  color: "#5e5086"
  extensions:
    - .ny
    - .nx
  aliases:
    - nyx
  codemirror_mode: null
  tm_scope: source.nyx
  language_id: 999999

